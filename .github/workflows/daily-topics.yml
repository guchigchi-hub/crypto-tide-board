name: 今日のトピックを更新

on:
  schedule:
    # 毎日 22:00 UTC = 日本時間 翌朝7:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: トピックを取得
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: node scripts/fetch-topics.mjs

      - name: 変更をコミット
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/topics.json; then
            echo "変更なし"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git add data/topics.json
            git commit -m "chore: 今日のトピックを更新"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN による push は他のワークフローを起動しない仕様のため、
      # コミットしたときは Pages のデプロイを明示的に呼び出す
      - name: サイトを再デプロイ
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml

      # 朝の通知を Discord へ送る（Webhook が Secrets に登録されているときだけ）。
      # トピック生成が失敗した朝も、価格・潮位だけで通知は届ける
      - name: Discordへ朝の通知
        if: success() || failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL 未設定のためスキップ"
          else
            node scripts/post-discord.mjs
          fi
