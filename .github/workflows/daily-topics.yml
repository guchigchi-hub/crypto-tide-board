name: 今日のトピックを更新

on:
  schedule:
    # 毎日 22:00 UTC = 日本時間 翌朝7:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: トピックを取得
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-topics.mjs

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/topics.json; then
            echo "変更なし"
          else
            git add data/topics.json
            git commit -m "chore: 今日のトピックを更新"
            git push
          fi
